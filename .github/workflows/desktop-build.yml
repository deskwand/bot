name: desktop-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Root typecheck and tests
        run: npm run typecheck && npm test

      - name: Go vet and tests
        working-directory: desktop
        run: go vet ./... && go test -race ./...

      - name: Frontend typecheck and production build
        working-directory: desktop/frontend
        run: npm run typecheck && npm run build

      - name: Install Playwright browser
        working-directory: desktop/frontend
        run: npx playwright install chromium

      - name: Browser end-to-end tests
        working-directory: desktop/frontend
        run: npx playwright test

      - name: Check release signing key
        id: signing
        env:
          DESKWAND_RELEASE_SIGNING_KEY: ${{ secrets.DESKWAND_RELEASE_SIGNING_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::notice title=Release packaging skipped::Pull requests run tests only; signed packages are built on push or manual dispatch."
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${DESKWAND_RELEASE_SIGNING_KEY:-}" ]; then
            echo "::notice title=Release packaging skipped::DESKWAND_RELEASE_SIGNING_KEY is not configured; tests ran, but no signed desktop package was built."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed desktop package
        if: steps.signing.outputs.present == 'true'
        env:
          DESKWAND_RELEASE_SIGNING_KEY: ${{ secrets.DESKWAND_RELEASE_SIGNING_KEY }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          key_file="$RUNNER_TEMP/deskwand-release-signing-key.pem"
          mkdir -p "$RUNNER_TEMP"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$DESKWAND_RELEASE_SIGNING_KEY" > "$key_file"
          chmod 600 "$key_file"
          export DESKWAND_RELEASE_SIGNING_KEY_FILE="$key_file"
          bash scripts/build-desktop.sh

      - name: Upload desktop artifacts
        if: steps.signing.outputs.present == 'true'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: deskwand-bot-${{ matrix.os }}
          path: |
            desktop/build/
            dist/worker-release/
          if-no-files-found: warn
          retention-days: 14
