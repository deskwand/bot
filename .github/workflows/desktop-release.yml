name: desktop-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version x.y.z; must match desktop/mygo.json"
        required: true
      platforms:
        description: "Which platforms to build"
        type: choice
        options: [both, macos, windows]
        default: both
      mode:
        description: "dry-run builds artifacts only; publish also uploads to R2"
        type: choice
        options: [dry-run, publish]
        default: dry-run
      confirm:
        description: "Type PUBLISH to upload; required when mode is publish"
        required: false

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_CONFIRM: ${{ inputs.confirm }}
  RELEASE_MODE: ${{ inputs.mode }}
  RELEASE_PLATFORMS: ${{ inputs.platforms }}

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  macos:
    if: ${{ inputs.platforms != 'windows' }}
    runs-on: macos-14
    environment: release
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate release inputs
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be x.y.z" >&2
            exit 1
          fi
          if [ "$RELEASE_MODE" = "publish" ] && [ "$RELEASE_CONFIRM" != "PUBLISH" ]; then
            echo "confirm must be PUBLISH when mode is publish" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/frontend/package-lock.json

      - name: Check the runner architecture
        run: |
          arch="$(uname -m)"
          if [ "$arch" != "arm64" ]; then
            echo "the macOS release needs an arm64 runner, got $arch" >&2
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix desktop/frontend ci

      - name: Checks
        run: |
          npm run check:i18n
          npm run typecheck
          npx vitest run --config vitest.node.config.ts tests-node/desktop-release.test.ts
          cd desktop && go vet ./... && go test -race ./...

      - name: Release preflight
        run: node --experimental-strip-types scripts/desktop-release.ts preflight "$RELEASE_VERSION"

      - name: Check the published manifest
        run: node --experimental-strip-types scripts/desktop-release.ts check-remote darwin-arm64 "$RELEASE_VERSION"

      - name: Write the release signing key
        env:
          DESKWAND_RELEASE_SIGNING_KEY: ${{ secrets.DESKWAND_RELEASE_SIGNING_KEY }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.DESKWAND_CLIENT_UPDATE_KEY }}
        run: |
          test -n "$DESKWAND_RELEASE_SIGNING_KEY" || { echo "missing Worker signing key" >&2; exit 1; }
          test -n "$MYGO_UPDATER_PRIVATE_KEY" || { echo "missing client update key" >&2; exit 1; }
          key_file="$RUNNER_TEMP/deskwand-release-signing-key.pem"
          printf '%s' "$DESKWAND_RELEASE_SIGNING_KEY" > "$key_file"
          chmod 600 "$key_file"
          echo "DESKWAND_RELEASE_SIGNING_KEY_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Prepare the Worker bundle and the frontend
        id: prepare
        run: |
          source scripts/lib/worker-bundle.sh
          prepare_worker_bundle "$PWD" "$RELEASE_VERSION" "$DESKWAND_RELEASE_SIGNING_KEY_FILE" "0.1.0"
          rm -rf desktop/build
          npm --prefix desktop/frontend run generate
          npm --prefix desktop/frontend run build

      - name: Build and upload
        if: ${{ inputs.mode == 'publish' }}
        working-directory: desktop/frontend
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.DESKWAND_CLIENT_UPDATE_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: |
          if [ "$RELEASE_CONFIRM" != "PUBLISH" ]; then
            echo "confirm must be PUBLISH when mode is publish" >&2
            exit 1
          fi
          npx mygo build -skip-build-command -platform darwin/arm64 -upload ..

      - name: Build without uploading
        if: ${{ inputs.mode == 'dry-run' }}
        working-directory: desktop/frontend
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.DESKWAND_CLIENT_UPDATE_KEY }}
        run: npx mygo build -skip-build-command -platform darwin/arm64 ..

      - name: Check the built artifacts
        run: |
          test -f "desktop/build/darwin-arm64/deskwand-bot-$RELEASE_VERSION-darwin-arm64.tar.gz"
          test -f "desktop/build/darwin-arm64/update-darwin-arm64.json"
          test -f "desktop/build/SHA256SUMS"
          test -f "desktop/build/darwin-arm64/install.sh"
          test -f "desktop/build/darwin-arm64/deskwand-bot-${RELEASE_VERSION}-arm64.dmg"

      - name: Verify the published release
        if: ${{ inputs.mode == 'publish' }}
        run: node --experimental-strip-types scripts/desktop-release.ts verify darwin-arm64 "$RELEASE_VERSION" desktop/build/darwin-arm64

      - name: Preserve built artifacts for review and recovery
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: deskwand-bot-darwin-arm64
          if-no-files-found: error
          path: |
            desktop/build/darwin-arm64/
            desktop/build/SHA256SUMS
          retention-days: 14

      - name: Remove the signing key
        if: ${{ always() }}
        run: rm -f "$DESKWAND_RELEASE_SIGNING_KEY_FILE"

  windows:
    needs: macos
    if: ${{ !cancelled() && inputs.platforms != 'macos' && (needs.macos.result == 'success' || (inputs.platforms == 'windows' && needs.macos.result == 'skipped')) }}
    runs-on: windows-latest
    environment: release
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate release inputs
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be x.y.z" >&2
            exit 1
          fi
          if [ "$RELEASE_MODE" = "publish" ] && [ "$RELEASE_CONFIRM" != "PUBLISH" ]; then
            echo "confirm must be PUBLISH when mode is publish" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/frontend/package-lock.json

      - name: Check the runner architecture and the race toolchain
        run: |
          arch="$(uname -m)"
          if [ "$arch" != "x86_64" ]; then
            echo "the Windows release needs an x86_64 runner, got $arch" >&2
            exit 1
          fi
          if ! gcc --version >/dev/null 2>&1; then
            echo "no gcc: go test -race cannot instrument the tests on this runner" >&2
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix desktop/frontend ci

      - name: Checks
        env:
          CGO_ENABLED: "1"
        run: |
          npm run check:i18n
          npm run typecheck
          npx vitest run --config vitest.node.config.ts tests-node/desktop-release.test.ts
          cd desktop && go vet ./... && go test -race ./...

      - name: Release preflight
        run: node --experimental-strip-types scripts/desktop-release.ts preflight "$RELEASE_VERSION"

      - name: Check the published manifest
        run: node --experimental-strip-types scripts/desktop-release.ts check-remote windows-amd64 "$RELEASE_VERSION"

      - name: Write the release signing key
        env:
          DESKWAND_RELEASE_SIGNING_KEY: ${{ secrets.DESKWAND_RELEASE_SIGNING_KEY }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.DESKWAND_CLIENT_UPDATE_KEY }}
        run: |
          test -n "$DESKWAND_RELEASE_SIGNING_KEY" || { echo "missing Worker signing key" >&2; exit 1; }
          test -n "$MYGO_UPDATER_PRIVATE_KEY" || { echo "missing client update key" >&2; exit 1; }
          key_file="$RUNNER_TEMP/deskwand-release-signing-key.pem"
          printf '%s' "$DESKWAND_RELEASE_SIGNING_KEY" > "$key_file"
          chmod 600 "$key_file"
          echo "DESKWAND_RELEASE_SIGNING_KEY_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Prepare the Worker bundle and the frontend
        id: prepare
        run: |
          source scripts/lib/worker-bundle.sh
          prepare_worker_bundle "$PWD" "$RELEASE_VERSION" "$DESKWAND_RELEASE_SIGNING_KEY_FILE" "0.1.0"
          rm -rf desktop/build
          npm --prefix desktop/frontend run generate
          npm --prefix desktop/frontend run build

      - name: Build and upload
        if: ${{ inputs.mode == 'publish' }}
        working-directory: desktop/frontend
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.DESKWAND_CLIENT_UPDATE_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: |
          if [ "$RELEASE_CONFIRM" != "PUBLISH" ]; then
            echo "confirm must be PUBLISH when mode is publish" >&2
            exit 1
          fi
          npx mygo build -skip-build-command -platform windows/amd64 -upload ..

      - name: Build without uploading
        if: ${{ inputs.mode == 'dry-run' }}
        working-directory: desktop/frontend
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.DESKWAND_CLIENT_UPDATE_KEY }}
        run: npx mygo build -skip-build-command -platform windows/amd64 ..

      - name: Check the built artifacts
        run: |
          test -f "desktop/build/windows-amd64/deskwand-bot-$RELEASE_VERSION-windows-amd64.tar.gz"
          test -f "desktop/build/windows-amd64/update-windows-amd64.json"
          test -f "desktop/build/SHA256SUMS"
          test -f "desktop/build/windows-amd64/install.ps1"
          test -f "desktop/build/windows-amd64/deskwand-bot-setup-$RELEASE_VERSION-amd64.exe"

      - name: Verify the published release
        if: ${{ inputs.mode == 'publish' }}
        run: |
          if [ "$RELEASE_PLATFORMS" = "both" ]; then
            node --experimental-strip-types scripts/desktop-release.ts verify windows-amd64 "$RELEASE_VERSION" desktop/build/windows-amd64 darwin-arm64
          else
            node --experimental-strip-types scripts/desktop-release.ts verify windows-amd64 "$RELEASE_VERSION" desktop/build/windows-amd64
          fi

      - name: Preserve built artifacts for review and recovery
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: deskwand-bot-windows-amd64
          if-no-files-found: error
          path: |
            desktop/build/windows-amd64/
            desktop/build/SHA256SUMS
          retention-days: 14

      - name: Remove the signing key
        if: ${{ always() }}
        run: rm -f "$DESKWAND_RELEASE_SIGNING_KEY_FILE"
