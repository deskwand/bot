name: container

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "container/**"
      - "scripts/build-container.ts"
      - "src/artifact-store.ts"
      - "compose.yaml"
      - ".github/workflows/container.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Compute version
        id: version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "value=pr-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install arm64 emulation
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Create buildx builder
        run: docker buildx create --use

      - name: Build and load the amd64 image
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg VERSION="$VERSION" \
            --tag deskwand-bot:ci \
            --load \
            -f container/Dockerfile .

      - name: Smoke test
        run: sh container/smoke.sh deskwand-bot:ci

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish multi-arch image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$VERSION" \
            --tag "ghcr.io/deskwand/bot:$VERSION" \
            --tag ghcr.io/deskwand/bot:latest \
            --push \
            -f container/Dockerfile .
