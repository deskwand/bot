name: container

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "container/**"
      - "scripts/build-container.ts"
      - "src/artifact-store.ts"
      - "compose.yaml"
      - ".github/workflows/container.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Compute version
        id: version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "value=pr-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install arm64 emulation
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Create buildx builder
        run: docker buildx create --use

      - name: Build and load the amd64 image
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg VERSION="$VERSION" \
            --tag deskwand-bot:ci \
            --load \
            -f container/Dockerfile .

      - name: Smoke test
        run: sh container/smoke.sh deskwand-bot:ci

      - name: Build the sandbox image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag deskwand-sandbox:ci \
            --load \
            -f container/Dockerfile.sandbox .

      - name: Smoke test the sandbox image
        run: |
          set -eu
          docker run --rm -d --name sandbox-ci -p 127.0.0.1:18080:8080 \
            -e SANDBOX_TOKEN=ci-token deskwand-sandbox:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS -H "Authorization: Bearer ci-token" http://127.0.0.1:18080/healthz >/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          docker logs sandbox-ci > /tmp/sandbox-ci.log 2>&1 || true
          docker rm -f sandbox-ci >/dev/null 2>&1 || true
          if [ "$ok" != 1 ]; then cat /tmp/sandbox-ci.log; echo "sandbox healthz never came up" >&2; exit 1; fi

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish multi-arch image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$VERSION" \
            --tag "ghcr.io/deskwand/bot:$VERSION" \
            --tag ghcr.io/deskwand/bot:latest \
            --push \
            -f container/Dockerfile .

      - name: Publish the multi-arch sandbox image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "ghcr.io/deskwand/sandbox:$VERSION" \
            --tag ghcr.io/deskwand/sandbox:latest \
            --push \
            -f container/Dockerfile.sandbox .
